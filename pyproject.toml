[project]
name = "iam-ad"
version = "0.1.0"
description = "API IAM de création de comptes utilisateurs dans Active Directory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "ldap3>=2.9.1",
    "pyjwt[crypto]>=2.10",
]

[project.scripts]
iam-ad = "iam_ad.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iam_ad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # ldap3 2.9.1 utilise encore d'anciens noms de pyasn1 ; les versions sont figées par uv.lock.
    "ignore:(tagMap|typeMap) is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
